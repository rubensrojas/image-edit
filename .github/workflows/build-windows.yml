name: Build Windows installer
run-name: Build Windows installer by @${{ github.actor }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TESSERACT_BUNDLE_DIR: ${{ github.workspace }}/build/tesseract
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install native build tools
        shell: pwsh
        run: choco install tesseract innosetup --yes --no-progress

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Prepare icons and Tesseract
        run: |
          python scripts/create_icons.py
          python scripts/stage_tesseract.py

      - name: Build Windows application
        run: pyinstaller --noconfirm --clean SREImageEditor.spec

      - name: Verify packaged application
        shell: pwsh
        run: '& "dist/SRE Image Editor/SRE Image Editor.exe" --smoke-test'

      - name: Create Windows installer
        shell: pwsh
        run: '& "C:/Program Files (x86)/Inno Setup 6/ISCC.exe" installer/windows.iss'

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: SRE-Image-Editor-Windows-x64
          path: release/SRE-Image-Editor-Windows-x64-Setup.exe
          if-no-files-found: error
          retention-days: 14
